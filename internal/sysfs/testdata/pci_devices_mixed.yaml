devices:
  # Non-NIC devices (dummy devices for testing)
  - id: "storage-controller-1"
    pci_address: "0000:00:01.0"
    pci_vendor_id: "0xaaaa"
    pci_device_id: "0x2922"
    subsystem_vendor_id: "0xaaaa"
    subsystem_device_id: "0x1234"
    device_class: "0x010601"  # SATA controller
    driver: "ahci"
  
  - id: "usb-controller-1"
    pci_address: "0000:00:02.0"
    pci_vendor_id: "0xbbbb"
    pci_device_id: "0x1c26"
    subsystem_vendor_id: "0xbbbb"
    subsystem_device_id: "0x5678"
    device_class: "0x0c0320"  # USB controller
    driver: "ehci_hcd"
  
  - id: "audio-controller-1"
    pci_address: "0000:00:03.0"
    pci_vendor_id: "0xcccc"
    pci_device_id: "0x1c20"
    subsystem_vendor_id: "0xcccc"
    subsystem_device_id: "0x9abc"
    device_class: "0x040300"  # Audio device
    driver: "snd_hda_xyz"
  
  - id: "bridge-1"
    pci_address: "0000:00:04.0"
    pci_vendor_id: "0xdddd"
    pci_device_id: "0x1c10"
    subsystem_vendor_id: "0xdddd"
    subsystem_device_id: "0xdef0"
    device_class: "0x060400"  # PCI bridge
    driver: "pcieport"
  
  - id: "graphics-controller-1"
    pci_address: "0000:01:00.0"
    parent_address: "0000:00:04.0"
    pci_vendor_id: "0xeeee"
    pci_device_id: "0x1b81"
    subsystem_vendor_id: "0xeeee"
    subsystem_device_id: "0x1234"
    device_class: "0x030000"  # VGA controller
    driver: "nouveau"
  
  - id: "wireless-controller-1"
    pci_address: "0000:02:00.0"
    pci_vendor_id: "0xfffe"
    pci_device_id: "0x095a"
    subsystem_vendor_id: "0xfffe"
    subsystem_device_id: "0x5010"
    device_class: "0x028000"  # Network controller
    driver: "iwlwifi"
  
  - id: "memory-controller-1"
    pci_address: "0000:00:05.0"
    pci_vendor_id: "0x1111"
    pci_device_id: "0x3b30"
    subsystem_vendor_id: "0x1111"
    subsystem_device_id: "0x7890"
    device_class: "0x050000"  # RAM controller
    driver: "i5000_edac"
  
  - id: "serial-controller-1"
    pci_address: "0000:00:06.0"
    pci_vendor_id: "0x2222"
    pci_device_id: "0x1c3d"
    subsystem_vendor_id: "0x2222"
    subsystem_device_id: "0xabcd"
    device_class: "0x070003"  # Serial controller
    driver: "serial"
  
  # First NIC
  - id: "nic1-virtual-downstream-port"
    pci_address: "0000:13:00.0"
    pci_vendor_id: "0x1dd8"
    pci_device_id: "0x1001"
    subsystem_vendor_id: "0x1dd8"
    subsystem_device_id: "0x2015"
    device_class: "0x060400"  # PCI bridge
    driver: "pcieport"
  - id: "nic1-pf"
    pci_address: "0000:14:00.0"
    parent_address: "0000:13:00.0"
    pci_vendor_id: "0x1dd8"
    pci_device_id: "0x1002"
    subsystem_vendor_id: "0x1dd8"
    subsystem_device_id: "0x5201"
    device_class: "0x020000"  # Ethernet controller
    driver: "ionic"
  - id: "nic1-vf"
    pci_address: "0000:14:00.1"
    parent_address: "0000:13:00.0"
    pci_vendor_id: "0x1dd8"
    pci_device_id: "0x1003"
    subsystem_vendor_id: "0x1dd8"
    subsystem_device_id: "0x5201"
    device_class: "0x020000"  # Ethernet controller
    driver: "ionic"
  
  # Second NIC - Virtual downstream port
  - id: "nic2-virtual-downstream-port"
    pci_address: "0000:15:00.0"
    pci_vendor_id: "0x1dd8"
    pci_device_id: "0x1001"
    subsystem_vendor_id: "0x1dd8"
    subsystem_device_id: "0x2015"
    device_class: "0x060400"  # PCI bridge
    driver: "pcieport"
  - id: "nic2-pf"
    pci_address: "0000:16:00.0"
    parent_address: "0000:15:00.0"
    pci_vendor_id: "0x1dd8"
    pci_device_id: "0x1002"
    subsystem_vendor_id: "0x1dd8"
    subsystem_device_id: "0x5201"
    device_class: "0x020000"  # Ethernet controller
    driver: "ionic"
  
  # Third NIC - Non-AMD Pensando network device (dummy)
  - id: "dummy-network-controller-1"
    pci_address: "0000:17:00.0"
    pci_vendor_id: "0x3333"
    pci_device_id: "0x4444"
    subsystem_vendor_id: "0x3333"
    subsystem_device_id: "0x5555"
    device_class: "0x020000"  # Ethernet controller
    driver: "dummy_net"
  
  # Additional non-NIC devices
  - id: "pci-device-misc-1"
    pci_address: "0000:03:00.0"
    pci_vendor_id: "0x6666"
    pci_device_id: "0x7777"
    subsystem_vendor_id: "0x6666"
    subsystem_device_id: "0x8888"
    device_class: "0x040100"  # Multimedia audio controller
    driver: "snd_dummy"
  
  - id: "pci-device-misc-2"
    pci_address: "0000:04:00.0"
    pci_vendor_id: "0x9999"
    pci_device_id: "0xaaaa"
    subsystem_vendor_id: "0x9999"
    subsystem_device_id: "0xbbbb"
    device_class: "0x0c0010"  # FireWire controller
    driver: "firewire_ohci"



