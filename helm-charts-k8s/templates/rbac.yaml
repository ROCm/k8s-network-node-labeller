apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName | default (printf "%s-node-labeller" .Release.Name) }}
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "helm-charts-network-nl.labels" . | nindent 4 }}

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.serviceAccountName | default (printf "%s-node-labeller" .Release.Name) }}
  labels:
  {{- include "helm-charts-network-nl.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - watch
  - get
  - list
  - update

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.serviceAccountName | default (printf "%s-node-labeller" .Release.Name) }}
  labels:
  {{- include "helm-charts-network-nl.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.serviceAccountName | default (printf "%s-node-labeller" .Release.Name) }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccountName | default (printf "%s-node-labeller" .Release.Name) }}
  namespace: {{ .Release.Namespace }}
